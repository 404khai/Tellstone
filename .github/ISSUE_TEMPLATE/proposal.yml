name: Proposal
description: Propose a design change, architectural decision, or major initiative
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for larger design proposals or architectural changes.
        For simple feature requests, use the **Feature / Enhancement** template instead.

  - type: input
    id: title
    attributes:
      label: Proposal title
      placeholder: "e.g. Shard-aware connection draining"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph executive summary of the proposal.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve or what opportunity does it unlock?
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Detailed design
      description: Describe the proposed design in detail. Include data structures, APIs, protocol changes, etc.
      render: markdown

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches were considered and why they were rejected.

  - type: textarea
    id: impact
    attributes:
      label: Impact / trade-offs
      description: Performance implications, breaking changes, migration path, operational concerns.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to related issues, papers, prior art, or discussions.
